name: Build and deploy website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install media optimizers
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: images-${{ runner.os }}-${{ hashFiles('scripts/optimize_images.py', 'scripts/prepare_videos.py', 'scripts/requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            images-${{ runner.os }}-${{ hashFiles('scripts/optimize_images.py', 'scripts/prepare_videos.py', 'scripts/requirements.txt') }}-
      - name: Test media optimizers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build site and optimize images
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
